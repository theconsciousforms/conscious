 const nAct=new Float32Array(JN);for(let e=0;e<jEdges.length;e+=3){const a=jEdges[e],b=jEdges[e+1],L=jEdges[e+2];
  nAct[a]=Math.max(nAct[a],act[b]*.93);nAct[b]=Math.max(nAct[b],act[a]*.93);
  const ia=a*3,ib=b*3,dx=pp[ib]-pp[ia],dy=pp[ib+1]-pp[ia+1],dz=pp[ib+2]-pp[ia+2],d=Math.hypot(dx,dy,dz)+1e-4,f=(d-L)*8/d*dt;
  pv[ia]+=dx*f;pv[ia+1]+=dy*f;pv[ia+2]+=dz*f;pv[ib]-=dx*f;pv[ib+1]-=dy*f;pv[ib+2]-=dz*f;
  const o=e/3*6;jPos.set([pp[ia],pp[ia+1],pp[ia+2],pp[ib],pp[ib+1],pp[ib+2]],o);}
 jg.attributes.position.needsUpdate=true;
 for(let i=0;i<PN;i++){const j=i*3,x=pp[j],y=pp[j+1],z=pp[j+2];let ax,ay,az;
  if(i<JN){act[i]=Math.max(act[i]*Math.exp(-dt*2.2),nAct[i]*(1-dt*3));ax=(jHome[j]-x)*4;ay=(jHome[j+1]-y)*4;az=(jHome[j+2]-z)*4;}
  else{const r=Math.hypot(x,y,z)+1e-4;ax=-x/r*(r-pR[i])*3-z*.6;ay=-y/r*(r-pR[i])*3;az=-z/r*(r-pR[i])*3+x*.6;act[i]*=.95;}
  if(ptrOn){const dx=x-pred.x,dy=y-pred.y,dz=z-pred.z,d2=dx*dx+dy*dy+dz*dz+.03,f=1.2*Math.exp(-d2*4)/Math.sqrt(d2);ax+=dx*f;ay+=dy*f;az+=dz*f;if(i<JN&&d2<.06)act[i]=1;}
  integrate(j,ax,ay,az,dt,.9,1.05);const w=Math.min(1,act[i]);
  pc[j]=base[j]+(1-base[j])*w*.2;pc[j+1]=base[j+1]+(.85-base[j+1])*w;pc[j+2]=base[j+2]+(1-base[j+2])*w;}}
// FRIDAY: boids swarm (separation, alignment, cohesion via sampled neighbours) + fast pointer-chasing bursts
function stepFriday(dt,t){const S=10;
 for(let i=0;i<PN;i++){const j=i*3,x=pp[j],y=pp[j+1],z=pp[j+2];let cx=0,cy=0,cz=0,vx=0,vy=0,vz=0,sx=0,sy=0,sz=0;
  for(let s=0;s<S;s++){const k=((i+1+s*157+((t*60)|0)*31)%PN)*3,dx=pp[k]-x,dy=pp[k+1]-y,dz=pp[k+2]-z,d2=dx*dx+dy*dy+dz*dz;
   cx+=dx;cy+=dy;cz+=dz;vx+=pv[k];vy+=pv[k+1];vz+=pv[k+2];if(d2<.04){sx-=dx/(d2+.005);sy-=dy/(d2+.005);sz-=dz/(d2+.005);}}
  let ax=cx/S*.6+(vx/S-pv[j])*2+sx*.02,ay=cy/S*.6+(vy/S-pv[j+1])*2+sy*.02,az=cz/S*.6+(vz/S-pv[j+2])*2+sz*.02;
  const r=Math.hypot(x,y,z)+1e-4;ax+=-x/r*(r-1.7)*2.5;ay+=-y/r*(r-1.7)*2.5;az+=-z/r*(r-1.7)*2.5;
  ax+=-z*.9;az+=x*.9;
  if(ptrOn){const dx=ptr.x-x,dy=ptr.y-y,dz=ptr.z-z,d=Math.hypot(dx,dy,dz)+.1;const f=(d<.25?-6:3)*Math.exp(-d*1.2)/d;ax+=dx*f;ay+=dy*f;az+=dz*f;}
  integrate(j,ax,ay,az,dt,.97,1.08);let sp=Math.hypot(pv[j],pv[j+1],pv[j+2]);if(sp>3.5){const k=3.5/sp;pv[j]*=k;pv[j+1]*=k;pv[j+2]*=k;}
  const w=Math.min(1,sp/3);pc[j]=base[j]+(1-base[j])*w*.6;pc[j+1]=base[j+1]+(.8-base[j+1])*w*.6;pc[j+2]=base[j+2]+(.4-base[j+2])*w*.6;}}
