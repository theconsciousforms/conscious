/* ===================== LOOK 2 · FIELD (interference, Chladni) =====================

 let simT=0,gT=0,fb=null;const OM=26;     // carrier angular frequency (rad per unit wave time)
 function step(h){}
 function frame(dt){if(!ok||!gpu)return;const U=uVar.material.uniforms,dts=U.uDt.value,ti=S.t-S.lastIgn,ign=ti>0&&ti<3.5?Math.exp(-ti/1.2):0,dsc=S.t-E.DEC.last;srcN=Math.min(NS,E.RG.length);
  for(let n=0;n<steps;n++){simT+=dts;E.RG.forEach((R,i)=>{if(i>=NS)return;const amp=(.25+2.2*R.act+.6*Math.min(1,R.rate))*(i===E.DEC.target&&dsc<1.5?2.5:1)*(1+ign*2);
    const ph=ign>.05?0:R.ph;SRC[i].set(R.p[0]*.9,R.p[2]*.9*1.6,amp*60,Math.sin(OM*simT+ph));});U.uN.value=srcN;gpu.compute();}
  plane.material.uniforms.tU.value=gpu.getCurrentRenderTarget(uVar).texture;plane.material.uniforms.uIgn.value=ign;
  if((gT+=dt)>.5){gT=0;const rt=gpu.getCurrentRenderTarget(uVar);if(!fb)fb=new Float32Array(N*N*4);renderer.readRenderTargetPixels(rt,0,0,N,N,fb);let su=0,se=0,n=0;   // auto-gain: normalise the display only (dynamics untouched)
   for(let y=0;y<N;y+=3)for(let x=0;x<N;x+=3){const dx=x/N*2-1,dy=y/N*2-1;if(dx*dx+dy*dy>.8)continue;const j=(y*N+x)*4;su+=fb[j]*fb[j];se+=fb[j+2];n++;}
   if(n&&su>0){const rms=Math.sqrt(su/n),me=se/n,U2=plane.material.uniforms;U2.uG.value+=(1/(rms*1.2)-U2.uG.value)*.5;U2.uE.value+=(1/(me+1e-12)-U2.uE.value)*.5;}}}
 function draw(){const ink=INK();rim.material.color.copy(ink);plane.material.uniforms.uNight.value=night?1:0;const m=plane.matrixWorld;let n=0;const cen=REG.map(()=>[0,0,0,0]);
  E.RG.forEach((R,i)=>{if(i>=NS)return;const v=new THREE.Vector3(R.p[0]*.9*2.4,R.p[2]*.9*1.6*2.4,.01).applyMatrix4(m),c=R.theme>=0?TC[R.theme]:ink;dots.P.set([v.x,v.y,v.z],n*3);dots.C.set(night?[c.r*.5+.5,c.g*.5+.5,c.b*.5+.5]:[c.r,c.g,c.b],n*3);dots.Z[n]=.02+.05*R.act+(i===E.DEC.target?.05:0);dots.A[n]=.5+.5*R.act;n++;
   if(R.theme>=0){const q=cen[R.theme];q[0]+=v.x;q[1]+=v.y;q[2]+=v.z;q[3]++;}});dots.up(n);
  REG.forEach((r,k)=>{const q=cen[k];if(!q[3]){thl[k].style.opacity=0;return;}thl[k].style.opacity=0;});}
 function cam(t){const a=t*.03;camera.position.set(Math.sin(a)*.8,4.6,7.2+Math.cos(a)*.3);camera.lookAt(0,-.6,0);}
 return {scene,init(){if(!gpu)initGPU();},step,frame,draw,cam,labels:thl,mats:[dots.m],q(l){steps=[2,4,7][l];},cap:'Field · each real region is a wave source whose phase follows its own rhythm. When regions fall into step, the membrane sings in standing geometry; when they do not, it is noise.'};}

/* ===================== LOOK 3 · MIRROR (the self-model) =====================
   Two point shells on the same directions (each point belongs to the real region nearest its direction). Outer shell: what is (each region's
   live activity sets its radius). Inner shell: what the mind predicts it is (the engine's forecast, radius grows with confidence). Points are
   masses on radial springs (semi-implicit Euler). Tension lines join each region's actual and predicted anchors, weighted by the prediction
   error. Awareness pulls the shells together; the "I" at the centre brightens with it. */
function Mirror(){const scene=new THREE.Scene(),NPt=[1400,2600,4200][QL];let live=NPt;
 const dirs=[],reg=new Int16Array(NPt),A={x:new Float32Array(NPt*3),v:new Float32Array(NPt*3)},B={x:new Float32Array(NPt*3),v:new Float32Array(NPt*3)};
 for(let i=0;i<NPt;i++){const y=1-2*(i+.5)/NPt,r=Math.sqrt(1-y*y),th=i*2.39996;dirs.push([Math.cos(th)*r,y,Math.sin(th)*r]);}
 const outer=ptsLayer(NPt,scene),inner=ptsLayer(NPt,scene),core=ptsLayer(3,scene);
 const tg=new THREE.BufferGeometry(),tp=new Float32Array(80*6),tc=new Float32Array(80*6),ta=new Float32Array(160);tg.setAttribute('position',new THREE.BufferAttribute(tp,3));tg.setAttribute('color',new THREE.BufferAttribute(tc,3));tg.setAttribute('al',new THREE.BufferAttribute(ta,1));
 const tmat=lineMat(),tl=new THREE.LineSegments(tg,tmat);tl.frustumCulled=false;scene.add(tl);
 const rayG=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(),new THREE.Vector3()]),ray=new THREE.Line(rayG,new THREE.LineBasicMaterial({color:0x0099ff,transparent:true,opacity:.6}));scene.add(ray);
 const shell=r=>new THREE.Mesh(new THREE.SphereGeometry(r,64,48),new THREE.ShaderMaterial({transparent:true,depthWrite:false,uniforms:{uC:{value:new THREE.Color()},uA:{value:.15}},vertexShader:`varying vec3 vN,vV;void main(){vN=normalize(normalMatrix*normal);vec4 mv=modelViewMatrix*vec4(position,1.);vV=normalize(-mv.xyz);gl_Position=projectionMatrix*mv;}`,fragmentShader:`uniform vec3 uC;uniform float uA;varying vec3 vN,vV;void main(){float f=1.-abs(dot(vN,vV));gl_FragColor=vec4(uC,pow(f,3.)*uA);}`}));
 const so=shell(1),si=shell(1);scene.add(so,si);
 const lab=[mkLabel('what is · live brain state',null,true),mkLabel('what I predict I am',null,true),mkLabel('I',null,true)];
 function init(){const D=E.RG.map(r=>r.dir);for(let i=0;i<NPt;i++){let b=0,bd=-9;D.forEach((d,k)=>{const s=d[0]*dirs[i][0]+d[1]*dirs[i][1]+d[2]*dirs[i][2];if(s>bd){bd=s;b=k;}});reg[i]=b;for(let k=0;k<3;k++){A.x[i*3+k]=dirs[i][k]*2.2;B.x[i*3+k]=dirs[i][k]*1.6;}}}
 const RA=r=>2.0+.55*r.act+.12*Math.min(1,r.rate),conf=()=>1-Math.min(1,S.err/.05),RB=r=>(1.45+.5*conf())+.55*r.pred+.12*Math.min(1,r.rate)*conf();
 function step(h){const t=S.t,aw=S.aware;
  for(let i=0;i<live;i++){const R=E.RG[reg[i]],d=dirs[i],ra=RA(R),rb=RB(R)*(1-aw*.25)+ra*aw*.25,sh=R.err*1.5;                     // awareness = convergence
   for(const [O,rt,k,c,j] of [[A,ra,40,5,sh*.4],[B,rb,28,4,sh]])for(let q=0;q<3;q++){const ix=i*3+q,tgt=d[q]*rt+Math.sin(t*7+i*1.7+q)*j*.08;O.v[ix]+=(k*(tgt-O.x[ix])-c*O.v[ix]+gauss()*j*2)*h;O.x[ix]+=O.v[ix]*h;}}}
 function draw(){const ink=INK(),acc=ACC(),red=RED();so.material.uniforms.uC.value.copy(ink);si.material.uniforms.uC.value.copy(acc);so.scale.setScalar(2.05);si.scale.setScalar(1.45+.5*conf());so.material.uniforms.uA.value=night?.35:.22;si.material.uniforms.uA.value=(night?.3:.18)*(.5+conf());
  for(let i=0;i<live;i++){const R=E.RG[reg[i]],c=R.theme>=0?TC[R.theme].clone().lerp(ink,.4):ink;outer.P.set([A.x[i*3],A.x[i*3+1],A.x[i*3+2]],i*3);outer.C.set(night?[c.r*.5+.45,c.g*.5+.45,c.b*.5+.5]:[c.r,c.g,c.b],i*3);outer.Z[i]=.022+.03*R.act;outer.A[i]=(night?.55:.5)+.4*R.act;
   inner.P.set([B.x[i*3],B.x[i*3+1],B.x[i*3+2]],i*3);inner.C.set([acc.r,acc.g,acc.b],i*3);inner.Z[i]=.018+.02*R.pred;inner.A[i]=(night?.45:.38)*(.5+.5*conf())+.3*Math.min(1,R.err*12)*Math.random();}
  outer.up(live);inner.up(live);
  let n=0;E.RG.forEach((R,k)=>{if(k>=80)return;const d=R.dir,e=Math.min(1,R.err*12);if(e<.04)return;const a=RA(R),b=RB(R);tp.set([d[0]*a,d[1]*a,d[2]*a,d[0]*b,d[1]*b,d[2]*b],n*6);const c=red.clone().lerp(acc,1-e);tc.set([c.r,c.g,c.b,c.r,c.g,c.b],n*6);ta[n*2]=e*.8;ta[n*2+1]=e*.3;n++;});
  tg.setDrawRange(0,n*2);for(const k of ['position','color','al'])tg.attributes[k].needsUpdate=true;
  const aw=S.aware,ti=S.t-S.lastIgn,ig=ti>0&&ti<4?Math.exp(-ti/1.3):0;core.P.set([0,0,0,0,0,0,0,0,0]);core.C.set([...[ink.r,ink.g,ink.b],...[acc.r,acc.g,acc.b],...[acc.r,acc.g,acc.b]]);
  core.Z.set([.05+.05*aw,.25+.6*aw+ig*.8,1.2*ig]);core.A.set([.95,.25+.45*aw,.35*ig]);core.up(3);
  const tg2=E.DEC.target;if(tg2>=0){const R=E.RG[tg2],a=RA(R);rayG.setFromPoints([new THREE.Vector3(),new THREE.Vector3(R.dir[0]*a,R.dir[1]*a,R.dir[2]*a)]);ray.material.opacity=.25+.5*Math.exp(-(S.t-E.DEC.last)/2);ray.visible=true;}else ray.visible=false;ray.material.color.copy(acc);
  place(lab[0],new THREE.Vector3(0,-2.3,0),-80,10);place(lab[1],new THREE.Vector3(0,-(1.45+.5*conf()),0),-62,-22);place(lab[2],new THREE.Vector3(0,0,0),10,-14);}
 function cam(t){const a=t*.06;camera.position.set(Math.sin(a)*8.6,1.4+Math.sin(t*.04)*.6,Math.cos(a)*8.6);camera.lookAt(0,0,0);}
 return {scene,init,step,draw,cam,labels:lab,mats:[outer.m,inner.m,core.m,tmat],q(l){live=Math.floor(NPt*[.45,.75,1][l]);},cap:'Mirror · the outer shell is what is; the inner shell is what the mind predicts it is. Red tension lines are prediction error. As awareness grows the shells converge on the "I" at the centre.'};}

/* ---------- look switcher ---------- */
const LOOKS={stream:Stream(),field:Field(),mirror:Mirror()};let look=null,lookName='';
function setLook(n){if(!LOOKS[n])n='stream';lookName=n;look=LOOKS[n];Object.entries(LOOKS).forEach(([k,L])=>L.labels.forEach(el=>el.style.display=k===n?'':'none'));if(E.ready&&!look.inited){look.init();look.inited=true;}
 document.querySelectorAll('#looks button').forEach(b=>b.classList.toggle('on',b.dataset.l===n));$('#cap').textContent=look.cap;const u=new URL(location);u.searchParams.set('look',n);history.replaceState(null,'',u);applyPal();}
document.querySelectorAll('#looks button').forEach(b=>b.onclick=()=>setLook(b.dataset.l));
addEventListener('keydown',e=>{const k={'1':'stream','2':'field','3':'mirror',s:'stream',f:'field',m:'mirror'}[e.key];if(k)setLook(k);if(e.key==='n')setPal(!night);});
function applyPal(){Object.values(LOOKS).forEach(L=>L.mats.forEach(blend));}
function setPal(n){night=n;document.body.classList.toggle('night',n);$('#pal').textContent='palette: '+(n?'night sky':'light');applyPal();}
$('#pal').onclick=()=>setPal(!night);
/* ---------- inputs & hooks ---------- */
addEventListener('pointermove',e=>E.input({ptr:Math.hypot(e.movementX||0,e.movementY||0)/300,side:e.clientX<innerWidth/2?'L':'R'}));
let mic=null,buf=null;$('#mic').onclick=async()=>{if(mic){mic.st.getTracks().forEach(t=>t.stop());mic=null;$('#mic').textContent='mic: off';return;}
 try{const st=await navigator.mediaDevices.getUserMedia({audio:true}),ac=new AudioContext(),an=ac.createAnalyser();an.fftSize=512;ac.createMediaStreamSource(st).connect(an);mic={st,an};buf=new Float32Array(512);$('#mic').textContent='mic: listening';}catch(e){$('#mic').textContent='mic: blocked';}};
function micLevel(){if(!mic)return 0;mic.an.getFloatTimeDomainData(buf);let s=0;for(const x of buf)s+=x*x;return Math.min(1,Math.sqrt(s/buf.length)*6);}
addEventListener('message',e=>{const d=e.data;if(!d||typeof d!=='object')return;if(d.type==='tcf-section')E.section(d.section);if(d.type==='tcf-speaking')S.vext=Math.max(0,Math.min(1,+d.level||0));if(d.type==='tcf-bot-event')E.input({bump:.12});});
E.on(ev=>{if(ev.kind==='decide'){Object.values(LOOKS).forEach(L=>L.onDecide&&L.onDecide(ev));thought();}if(window.parent!==window)window.parent.postMessage({type:'thira-event',event:ev,source:'mind'},'*');});
function thought(){$('#thought').innerHTML='<b>thought stream · decisions</b>'+E.DEC.log.slice(0,4).map(d=>`<div class="dc"><span class="m m-${d.mode}">${d.mode}</span> → <b>${d.target}</b>${d.region?' · '+REG.find(r=>r[0]===d.region)[1]:''} <i>t=${d.t}s</i><br><small>${d.winner} won · evidence MB ${d.evidence.MB} · CX ${d.evidence.CX} · LH ${d.evidence.LH}</small><br><small>${d.reason}</small></div>`).join('');}
function hud(){const s=S,D=E.DEC;$('#hud').innerHTML=`<b>mind · ${lookName}</b><br>awareness ${s.aware.toFixed(2)} · workspace G ${s.G.toFixed(2)}<br>prediction error ${s.err.toFixed(3)} · coherence r ${s.r.toFixed(2)}<br>ignitions ${s.ignN} · decisions ${D.n} · mode ${D.mode}<br>race`+
 ['MB','CX','LH'].map((k,i)=>`<div class="bar"><span>${['mushroom body','central cx','lateral horn'][i]}</span><i style="width:${Math.min(100,D.X[i]*180)}%"></i><em>${D.X[i].toFixed(2)}</em></div>`).join('')+(E.ready?'':'<br>FlyWire data: loading…');}
/* ---------- main loop: fixed steps ---------- */
const HN=1/120;let acc=0,last=0,fps=60,qT=0;const clock=new THREE.Clock();
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.fov=camera.aspect<1?62:40;camera.updateProjectionMatrix();Object.values(LOOKS).forEach(L=>L.mats.forEach(m=>{if(m.uniforms&&m.uniforms.uS)m.uniforms.uS.value=renderer.getPixelRatio()*innerHeight/900;}));}
addEventListener('resize',resize);resize();
function render(){const now=clock.getElapsedTime(),dt=Math.min(now-last,.1);last=now;fps+=(1/Math.max(dt,1e-3)-fps)*.05;qT+=dt;
 if(qT>3){qT=0;if(fps<26&&QL>0&&!Q.has('q')){QL--;renderer.setPixelRatio(1);resize();Object.values(LOOKS).forEach(L=>L.q(QL));}}            // adaptive quality
 if(E.ready&&look){acc+=dt;let n=0;while(acc>=HN&&n<12){E.input({voice:Math.max(micLevel(),S.vext)});E.step(HN);look.step(HN);acc-=HN;n++;}if(n===12)acc=0;
  look.record&&look.record(dt);look.frame&&look.frame(dt);look.draw();}
 look&&look.cam(now);renderer.render(look?look.scene:new THREE.Scene(),camera);
 if(Math.floor(now*4)!==render.h){render.h=Math.floor(now*4);hud();if(window.parent!==window)window.parent.postMessage({type:'thira-state',source:'mind',state:{...E.snapshot(),look:lookName}},'*');}}
setPal(night);setLook(Q.get('look')||'stream');
E.load('data/flywire-neuropils.json').then(()=>{Object.values(LOOKS).forEach(L=>L.inited=false);look.init();look.inited=true;thought();}).catch(e=>{$('#credit').innerHTML='FlyWire data: <b>not connected yet</b> (data/flywire-neuropils.json could not be loaded)';});
renderer.setAnimationLoop(render);
window.mindState=()=>({...E.snapshot(),look:lookName,quality:QL});window.mindLook=setLook;window.mindPalette=setPal;window.mindDecisions=()=>E.DEC.log.slice();window.__ready=true;
</script></body></html>
